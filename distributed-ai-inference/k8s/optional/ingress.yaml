# OPTIONAL and NOT applied by default. Requires an Ingress controller (e.g. ingress-nginx) to be installed
# in your cluster first; without one this object does nothing.
# Apply with:  kubectl apply -f k8s/optional/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inference-api
  namespace: inference
spec:
  ingressClassName: nginx
  rules:
    - host: inference.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inference-api
                port: {number: 80}
