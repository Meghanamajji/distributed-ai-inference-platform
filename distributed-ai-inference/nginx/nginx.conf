worker_processes auto;

events {
    worker_connections 4096;
}

http {
    log_format upstream_log '$remote_addr "$request" $status req_id=$request_id '
                            'upstream=$upstream_addr req_time=$request_time upstream_time=$upstream_response_time';
    access_log /dev/stdout upstream_log;
    error_log  /dev/stderr warn;

    # Round-robin (the default): requests alternate between replicas.
    # Docker's DNS resolves these names once, when nginx starts.
    upstream inference_api {
        server api1:8000 max_fails=3 fail_timeout=5s;
        server api2:8000 max_fails=3 fail_timeout=5s;
        keepalive 64;                 # reuse connections to the replicas
    }

    server {
        listen 80;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # /metrics would hit a random replica and be meaningless/unsafe to expose publicly.
        # Prometheus scrapes each replica directly on the internal Docker network instead.
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://inference_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;   # the app logs this id => end-to-end tracing
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout;           # only retries when the replica was unreachable
        }
    }
}
